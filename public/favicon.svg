<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <clipPath id="roundClip">
      <circle cx="256" cy="256" r="244" />
    </clipPath>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Masked Image -->
  <g clip-path="url(#roundClip)">
    <image href="/igris-logo.png" x="0" y="0" width="512" height="512" />
  </g>

  <!-- Outer Monarch Ring Frame -->
  <circle cx="256" cy="256" r="244" fill="none" stroke="url(#ringGrad)" stroke-width="14" filter="url(#ringGlow)"/>
</svg>